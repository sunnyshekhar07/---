<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07000f">
<title>दीपावली शुभकामनाएं — उमेश प्रसाद यादव</title>
<style>
:root{--gold:#ffd76a;--gold2:#ff9b19;--cream:#fff4d1;--bg:#07000f}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:white}
#scene{position:fixed;inset:0;overflow:hidden;background:
 radial-gradient(circle at 50% 48%,rgba(255,157,25,.18),transparent 28%),
 radial-gradient(circle at 50% 100%,rgba(126,0,40,.25),transparent 55%),
 linear-gradient(145deg,#07000f,#18001f 48%,#040008)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.particles{position:absolute;inset:0;z-index:2;overflow:hidden;pointer-events:none}
.particle{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffd76a;box-shadow:0 0 12px #ffb000;animation:float 5s linear infinite}
@keyframes float{0%{transform:translateY(20vh) scale(.4);opacity:0}20%{opacity:1}100%{transform:translateY(-110vh) scale(1.2);opacity:0}}

.diya{position:absolute;z-index:4;width:58px;height:30px;border-radius:0 0 40px 40px;background:linear-gradient(#ff7b13,#751400);box-shadow:0 10px 35px #ff6a0088}
.diya:before{content:"";position:absolute;left:50%;top:-29px;transform:translateX(-50%);width:16px;height:29px;border-radius:50%;background:#ffe17c;box-shadow:0 0 8px #fff,0 0 25px #ffad00,0 0 45px #ff4d00}
.d1{left:7%;bottom:8%}.d2{right:7%;bottom:8%}.d3{left:18%;top:14%;transform:scale(.7)}.d4{right:18%;top:14%;transform:scale(.7)}

.logoIntro{position:absolute;z-index:12;left:50%;top:30%;transform:translate(-50%,-50%);width:105px;height:105px;object-fit:contain;filter:drop-shadow(0 0 24px #ffd04d);animation:logoGlow 2.5s ease-in-out infinite}
@keyframes logoGlow{50%{filter:drop-shadow(0 0 40px #ff9f22)}}

.intro{position:absolute;z-index:20;left:50%;top:56%;transform:translate(-50%,-50%);width:min(92vw,500px);text-align:center}
.kicker{font-size:13px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
.intro h1{margin:12px 0 8px;font-size:clamp(25px,7vw,42px);font-weight:800}
.intro p{margin:0 0 25px;color:#eadfc8;font-size:15px;line-height:1.6}
#tap{border:2px solid var(--gold);border-radius:999px;background:linear-gradient(135deg,#8e1f00,#ff8b00,#9b2500);color:#fff;width:min(75vw,240px);min-height:62px;font-size:22px;font-weight:900;letter-spacing:2px;cursor:pointer;box-shadow:0 0 15px #ffd76a,0 0 42px #ff6a0080;animation:pulse 1.5s infinite;touch-action:manipulation}
@keyframes pulse{50%{transform:scale(1.045);box-shadow:0 0 28px #ffd76a,0 0 58px #ff6a00a0}}

.reveal{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;opacity:0;transform:scale(.96);pointer-events:none;transition:opacity 1.1s .6s,transform 1.1s .6s}
.open .reveal{opacity:1;transform:scale(1)}
.card{width:min(92vw,760px);padding:25px 20px 28px;border:1px solid #ffd76a88;border-radius:30px;background:linear-gradient(145deg,#22002dbf,#07000ed9);backdrop-filter:blur(10px);box-shadow:0 0 80px #ff8b0026}
.card .logo{width:65px;height:65px;object-fit:contain;filter:drop-shadow(0 0 15px #ffd76a)}
.photo{width:clamp(135px,34vw,205px);height:clamp(135px,34vw,205px);object-fit:cover;border-radius:50%;display:block;margin:12px auto 18px;border:4px solid var(--gold);box-shadow:0 0 0 6px #5b230044,0 0 40px #ff9d0088}
.wish{font-size:clamp(18px,4.5vw,29px);line-height:1.65;color:#fff8e6}
.wish b{display:block;margin:2px 0;color:var(--gold);font-family:Georgia,"Noto Serif Devanagari",serif;font-style:italic;font-size:clamp(38px,11vw,70px);line-height:1.15;text-shadow:0 0 10px #ffb300,0 0 30px #ff7b00}
.name{margin-top:16px;font-size:clamp(22px,5vw,35px);font-weight:900}
.role{margin-top:5px;color:#e9d9ba;font-size:clamp(13px,3.5vw,18px)}
.spark{position:absolute;z-index:5;opacity:0;font-size:32px}
.open .spark{animation:spark 1.4s ease-out forwards}
@keyframes spark{0%{transform:scale(.2);opacity:0}25%{opacity:1}100%{transform:scale(1.8) translateY(-30px);opacity:0}}

@media(max-width:600px){
 .logoIntro{top:25%;width:88px;height:88px}
 .intro{top:58%}
 .intro h1{font-size:28px}
 .intro p{font-size:14px;padding:0 8px}
 .d3,.d4{display:none}
}
</style>
</head>
<body>
<div id="scene">
 <canvas id="fx"></canvas>
 <div class="particles" id="particles"></div>
 <div class="diya d1"></div><div class="diya d2"></div><div class="diya d3"></div><div class="diya d4"></div>
 <img class="logoIntro" src="logo.png" alt="Logo">

 <div class="intro">
  <div class="kicker">एक खास शुभकामना</div>
  <h1>आपके लिए एक संदेश</h1>
  <p>दीपावली की शुभकामनाओं का एक खास अनुभव पाने के लिए नीचे टैप करें।</p>
  <button id="tap">🪔 TAP 🪔</button>
 </div>

 <div class="reveal">
  <div class="card">
   <img class="logo" src="logo.png" alt="Logo">
   <img class="photo" src="leader.png" alt="उमेश प्रसाद यादव">
   <div class="wish">
    <span>मेरी ओर से आप सभी को</span>
    <b>दीपावली</b>
    <span>की ढेर सारी बधाई एवं शुभकामनाएं।</span>
   </div>
   <div class="name">उमेश प्रसाद यादव</div>
   <div class="role">समाजसेवी व पूर्व मुखिया पति, गुरमियाँ पंचायत</div>
  </div>
 </div>

 <div class="spark" style="left:15%;top:30%">✦</div>
 <div class="spark" style="right:15%;top:34%">✧</div>
</div>
<script>
const scene=document.getElementById('scene'),tap=document.getElementById('tap');
let opened=false;
for(let i=0;i<34;i++){
 const p=document.createElement('i');p.className='particle';
 p.style.left=Math.random()*100+'%';p.style.top=(50+Math.random()*55)+'%';
 p.style.animationDelay=(Math.random()*5)+'s';p.style.animationDuration=(4+Math.random()*5)+'s';
 document.getElementById('particles').appendChild(p);
}
tap.addEventListener('click',()=>{
 if(opened)return;opened=true;scene.classList.add('open');fireworks();
});
tap.addEventListener('touchend',e=>{e.preventDefault();tap.click()},{passive:false});

const c=document.getElementById('fx'),ctx=c.getContext('2d');let W,H,ps=[];
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function burst(x,y){const cs=['#ffd76a','#ff9b19','#fff4b0','#ff4b2b','#fff'];for(let i=0;i<75;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*4.8;ps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c:cs[i%cs.length],r:1+Math.random()*2})}}
function fireworks(){for(let i=0;i<8;i++)setTimeout(()=>burst(innerWidth*(.12+.76*Math.random()),innerHeight*(.12+.48*Math.random())),i*420);animate()}
function animate(){ctx.clearRect(0,0,innerWidth,innerHeight);for(let i=ps.length-1;i>=0;i--){let p=ps[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.life-=.014;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();if(p.life<=0)ps.splice(i,1)}ctx.globalAlpha=1;if(opened)requestAnimationFrame(animate)}
</script>
</body>
  </html>
